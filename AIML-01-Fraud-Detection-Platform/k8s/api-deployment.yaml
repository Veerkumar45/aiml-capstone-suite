apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring-api
  namespace: fraud-detection-prod
  labels:
    app: fraud-scoring-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-scoring-api
  template:
    metadata:
      labels:
        app: fraud-scoring-api
    spec:
      containers:
        - name: api
          image: fraud-platform/scoring-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-server:5000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-scoring-api-service
  namespace: fraud-detection-prod
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: fraud-scoring-api
